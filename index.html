<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Akaya+Kanadaka&display=swap" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Amaranth:ital,wght@0,400;0,700;1,400;1,700&display=swap"
        rel="stylesheet">
    <title>Document</title>
</head>

<body>
    <main class="container-main">
        <h1>Registro de Gastos</h1>
        <div class="panel-superior">
            <div class="formulario">
                <select id="categorias">
                    <option>Comida</option>
                    <option>Transporte</option>
                    <option>Entretenimiento</option>
                    <option>Servicios</option>
                    <option>Otros</option>
                </select>
                <input type="text" id="descripcion" placeholder="Descripción del gasto">
                <div class="monto-boton">
                    <input type="text" id="monto" placeholder="Monto">
                    <button id="agregar" class="agregar">Agregar Gasto</button>
                </div>
            </div>
            <div class="resumen">
                <div id="totalHoy"></div>
                <div id="totalMes"></div>
                <div id="totalCategoria"></div>
            </div>
        </div>
        <div class="lista">
            <div id="totalGastosIndividuales"></div>
        </div>
    </main>
    <script src="script.js"></script>
</body>

</html>
